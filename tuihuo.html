<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>退货退款详情</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #151923;
      overflow-x: hidden;
    }

    :root {
      --shot-width: 1179px;
      --shot-height: 2556px;
      --stage-scale: 1;
      --page-bg: #f4f5f7;
      --text-main: #151923;
      --text-muted: #8f949d;
      --text-light: #b8bcc3;
      --pink: #ff2f63;
      --blue: #1683d8;
      --line: #e2e4e8;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 编辑区在截图外，只负责录入商家地址。 */
    .editor-panel {
      width: 100%;
      max-width: var(--shot-width);
      background: #fff;
      border-radius: 0 0 20px 20px;
      padding: 16px 18px 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .editor-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .textarea, .input {
      width: 100%;
      border: 1.5px solid #ddd;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
      background: #fff;
      margin-bottom: 8px;
      font-family: inherit;
    }

    .textarea {
      min-height: 70px;
      resize: vertical;
      line-height: 1.5;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .editor-actions {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      margin-top: 6px;
    }

    .small-btn {
      height: 38px;
      padding: 0 12px;
      border-radius: 19px;
      border: 0;
      background: #ff7b00;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .small-btn.secondary {
      background: #f3f3f3;
      color: #333;
      border: 1px solid #d9d9d9;
    }

    .small-btn.export-btn {
      background: linear-gradient(135deg, #ff8a00, #ff005c);
      margin-left: auto;
    }

    .page-shell {
      width: 100%;
      max-width: 100vw;
      overflow: hidden;
    }

    .scale-viewport {
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 0;
      padding: 10px 0;
    }

    .phone {
      width: var(--shot-width);
      min-width: var(--shot-width);
      height: var(--shot-height);
      flex-shrink: 0;
      background: var(--page-bg);
      position: relative;
      overflow: hidden;
      transform-origin: top center;
      transform: scale(var(--stage-scale));
      will-change: transform;
    }

    /* 自动截图模式只给本机导出使用，不影响正常编辑页面。 */
    body.shot-mode {
      display: block;
      width: var(--shot-width);
      height: var(--shot-height);
      min-height: var(--shot-height);
      overflow: hidden;
    }

    body.shot-mode .editor-panel {
      display: none;
    }

    body.shot-mode .page-shell {
      width: var(--shot-width);
      max-width: none;
      overflow: hidden;
    }

    body.shot-mode .scale-viewport {
      width: var(--shot-width);
      height: var(--shot-height) !important;
      padding: 0;
      justify-content: flex-start;
    }

    body.shot-mode .phone {
      transform: none !important;
    }

    .top-white {
      position: relative;
      height: 642px;
      background: #fff;
      border-radius: 0 0 55px 55px;
    }

    .status-bar {
      height: 158px;
      position: relative;
    }

    .status-time {
      position: absolute;
      left: 154px;
      top: 58px;
      font-size: 52px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .2px;
      color: #05070b;
    }

    .status-right {
      position: absolute;
      right: 126px;
      top: 57px;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 28px;
      color: #05070b;
    }

    .signal-bars {
      width: 58px;
      height: 40px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .signal-bars span {
      width: 10px;
      background: #05070b;
      border-radius: 5px;
      display: block;
    }

    .signal-bars span:nth-child(1) { height: 21px; }
    .signal-bars span:nth-child(2) { height: 29px; }
    .signal-bars span:nth-child(3) { height: 36px; }
    .signal-bars span:nth-child(4) { height: 27px; background: #cdd0d5; }

    .wifi {
      width: 60px;
      height: 44px;
      position: relative;
      overflow: hidden;
    }

    .wifi::before,
    .wifi::after,
    .wifi span {
      content: "";
      position: absolute;
      left: 50%;
      border: 8px solid #05070b;
      border-left-color: transparent;
      border-right-color: transparent;
      border-bottom-color: transparent;
      transform: translateX(-50%);
      border-radius: 50%;
    }

    .wifi::before {
      width: 70px;
      height: 70px;
      top: 4px;
    }

    .wifi::after {
      width: 45px;
      height: 45px;
      top: 18px;
    }

    .wifi span {
      width: 19px;
      height: 19px;
      top: 32px;
    }

    .battery {
      position: relative;
      min-width: 78px;
      height: 42px;
      border-radius: 12px;
      background: #05070b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      font-size: 31px;
      font-weight: 800;
      line-height: 1;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -9px;
      top: 13px;
      width: 7px;
      height: 16px;
      border-radius: 0 5px 5px 0;
      background: #cdd0d5;
    }

    .nav-row {
      height: 150px;
      position: relative;
    }

    .back-chevron {
      position: absolute;
      left: 68px;
      top: 50px;
      width: 41px;
      height: 41px;
      border-left: 7px solid #151923;
      border-bottom: 7px solid #151923;
      transform: rotate(45deg);
      border-radius: 3px;
    }

    .steps {
      position: absolute;
      left: 206px;
      top: 54px;
      display: flex;
      align-items: center;
      gap: 18px;
      white-space: nowrap;
      font-size: 38px;
      line-height: 1;
      color: #bdc1c7;
      font-weight: 400;
    }

    .steps .current {
      color: #151923;
      font-weight: 600;
    }

    .steps .arrow {
      color: #d4d7dc;
      font-size: 25px;
      font-weight: 400;
      margin-top: 2px;
    }

    .more {
      position: absolute;
      right: 60px;
      top: 50px;
      width: 73px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .more span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #151923;
      display: block;
    }

    .notify-badge {
      position: absolute;
      right: 3px;
      top: -31px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #ff426b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
    }

    .hero-title {
      margin: 80px 0 0;
      text-align: center;
      font-size: 88px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 1px;
      color: #151923;
    }

    .hero-desc {
      margin-top: 58px;
      text-align: center;
      font-size: 39px;
      line-height: 1.1;
      color: #151923;
      font-weight: 400;
      white-space: nowrap;
    }

    .hero-desc .deadline {
      color: var(--pink);
      padding: 0 8px;
    }

    .card {
      background: #fff;
      border-radius: 45px;
      margin-left: 25px;
      margin-right: 25px;
      overflow: hidden;
    }

    .merchant-card {
      height: 688px;
      margin-top: 27px;
      padding: 39px 38px 0;
    }

    .merchant-address {
      min-height: 200px;
      display: grid;
      grid-template-columns: 210px 1fr;
      column-gap: 20px;
    }

    .merchant-label {
      font-size: 38px;
      line-height: 48px;
      font-weight: 500;
      color: #151923;
    }

    .merchant-value {
      max-width: 730px;
      justify-self: end;
      text-align: right;
      color: #151923;
      font-size: 38px;
      line-height: 1.27;
      font-weight: 700;
      word-break: break-all;
    }

    .merchant-name-line {
      display: flex;
      justify-content: flex-end;
      gap: 30px;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    .merchant-address-line {
      display: inline;
    }

    .copy-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--blue);
      font-size: 37px;
      line-height: 1;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      margin-left: 12px;
    }

    .copy-icon {
      position: relative;
      width: 27px;
      height: 29px;
      border: 4px solid var(--blue);
      border-radius: 8px;
      display: inline-block;
    }

    .copy-icon::before {
      content: "";
      position: absolute;
      left: -9px;
      top: -8px;
      width: 20px;
      height: 22px;
      border: 4px solid var(--blue);
      border-radius: 8px;
      background: #fff;
    }

    .separator {
      height: 1px;
      background: var(--line);
      margin: 40px 0 0;
    }

    .send-row {
      display: grid;
      grid-template-columns: 1fr 315px;
      align-items: center;
      column-gap: 26px;
      padding-top: 50px;
    }

    .send-title {
      font-size: 49px;
      line-height: 1.15;
      color: #151923;
      font-weight: 700;
      white-space: nowrap;
    }

    .free-tag {
      margin-top: 8px;
      display: inline-flex;
      height: 37px;
      align-items: center;
      padding: 0 10px;
      border-radius: 4px;
      background: #fff2f5;
      color: var(--pink);
      font-size: 28px;
      line-height: 37px;
      font-weight: 400;
    }

    .send-desc {
      margin-top: 18px;
      font-size: 36px;
      line-height: 1;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .primary-btn {
      width: 315px;
      height: 111px;
      border-radius: 56px;
      border: 0;
      background: linear-gradient(90deg, #ff862e 0%, #ff005c 100%);
      color: #fff;
      font-size: 43px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .self-send-row {
      display: grid;
      grid-template-columns: 1fr 315px;
      align-items: end;
      column-gap: 26px;
      padding-top: 71px;
    }

    .self-title {
      font-size: 47px;
      line-height: 1;
      color: #151923;
      font-weight: 800;
      white-space: nowrap;
    }

    .self-desc {
      margin-top: 24px;
      font-size: 36px;
      line-height: 1;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .outline-btn {
      width: 315px;
      height: 113px;
      border-radius: 57px;
      border: 2px solid #c8ccd2;
      background: #fff;
      color: #151923;
      font-size: 43px;
      font-weight: 800;
    }

    .service-card {
      height: 228px;
      margin-top: 27px;
      padding: 42px 38px 0;
      position: relative;
    }

    .service-title {
      font-size: 48px;
      line-height: 1;
      color: #151923;
      font-weight: 800;
      margin-bottom: 50px;
    }

    .service-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      font-size: 37px;
      line-height: 1;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .shield {
      width: 34px;
      height: 38px;
      border: 4px solid #151923;
      border-radius: 14px 14px 18px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      vertical-align: -8px;
      position: relative;
    }

    .shield::after {
      content: "";
      width: 12px;
      height: 7px;
      border-left: 4px solid #151923;
      border-bottom: 4px solid #151923;
      transform: rotate(-45deg);
      margin-top: -2px;
    }

    .service-strong {
      color: #151923;
    }

    .view-link {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .chevron-right {
      width: 20px;
      height: 20px;
      border-right: 5px solid var(--text-muted);
      border-bottom: 5px solid var(--text-muted);
      transform: rotate(-45deg);
      display: inline-block;
    }

    .record-card {
      height: 143px;
      margin-top: 27px;
      padding: 44px 38px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .record-title {
      font-size: 48px;
      line-height: 1;
      color: #151923;
      font-weight: 800;
    }

    .return-card {
      height: 529px;
      margin-top: 27px;
      padding: 47px 38px 0;
    }

    .return-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 54px;
    }

    .return-title {
      font-size: 48px;
      line-height: 1;
      color: #151923;
      font-weight: 800;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 37px;
      line-height: 1;
      color: #151923;
      font-weight: 500;
      white-space: nowrap;
    }

    .chat-icon {
      width: 38px;
      height: 29px;
      border: 4px solid #151923;
      border-radius: 50%;
      position: relative;
    }

    .chat-icon::after {
      content: "";
      position: absolute;
      left: 4px;
      bottom: -9px;
      width: 13px;
      height: 13px;
      border-left: 4px solid #151923;
      border-bottom: 4px solid #151923;
      transform: rotate(-18deg);
      background: #fff;
    }

    .chat-icon span,
    .chat-icon::before {
      content: "";
      position: absolute;
      top: 10px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #151923;
    }

    .chat-icon span { left: 10px; }
    .chat-icon::before { right: 10px; }

    .product-row {
      display: grid;
      grid-template-columns: 156px 1fr;
      column-gap: 28px;
      align-items: start;
    }

    .product-thumb {
      width: 156px;
      height: 156px;
      border-radius: 17px;
      display: block;
      object-fit: cover;
    }

    .product-name {
      padding-top: 29px;
      font-size: 37px;
      line-height: 1.22;
      color: #151923;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sku {
      margin-top: 18px;
      font-size: 37px;
      line-height: 1;
      color: var(--text-muted);
      font-weight: 500;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 54px;
      font-size: 37px;
      line-height: 1;
      color: var(--text-muted);
      font-weight: 400;
    }

    .summary-row + .summary-row {
      margin-top: 48px;
    }

    .summary-value {
      color: var(--text-muted);
      font-weight: 700;
    }

    .bottom-actions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 246px;
      background: #fff;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 28px;
      padding: 27px 39px 0 0;
    }

    .bottom-btn {
      width: 253px;
      height: 76px;
      border-radius: 39px;
      border: 2px solid #a7abb2;
      background: #fff;
      color: #151923;
      font-size: 39px;
      line-height: 1;
      font-weight: 500;
    }

    .export-clone {
      position: fixed;
      left: -99999px;
      top: 0;
      width: var(--shot-width);
      z-index: -1;
      pointer-events: none;
    }

    .phone.exporting {
      transform: none !important;
      width: var(--shot-width) !important;
      height: var(--shot-height) !important;
      max-width: none !important;
    }
  </style>
</head>
<body>
  <div class="editor-panel">
    <div class="editor-title">商家地址录入</div>
    <textarea id="fullAddressInput" class="textarea" placeholder="粘贴商家退货信息，点击「粘贴并识别」自动拆分"></textarea>
    <div class="mini-grid">
      <input id="receiverInput" class="input" placeholder="商家名称" value="郑子玄-新退货" />
      <input id="phoneInput" class="input" placeholder="手机号" value="18357909912" />
    </div>
    <textarea id="addressInput" class="textarea" placeholder="商家退货地址" style="min-height:50px;">浙江省金华市义乌市苏溪镇上楼3区19幢一楼</textarea>
    <div class="editor-actions">
      <button class="small-btn" id="parseBtn">粘贴并识别</button>
      <button class="small-btn secondary" id="applyBtn">应用</button>
      <button class="small-btn secondary" id="fillSampleBtn">重置</button>
      <button class="small-btn export-btn" id="exportBtn">导出截图</button>
    </div>
  </div>

  <div class="page-shell">
    <div class="scale-viewport" id="scaleViewport">
      <div class="phone" id="captureRoot">
        <div class="top-white">
          <div class="status-bar">
            <div class="status-time" id="statusTime">11:51</div>
            <div class="status-right">
              <div class="signal-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
              <div class="wifi" aria-hidden="true"><span></span></div>
              <div class="battery" id="statusBattery">90</div>
            </div>
          </div>

          <div class="nav-row">
            <div class="back-chevron" aria-hidden="true"></div>
            <div class="steps">
              <span>商家审核</span><span class="arrow">→</span><span class="current">寄回商品</span><span class="arrow">→</span><span>商家退款</span><span class="arrow">→</span><span>退款完成</span>
            </div>
            <div class="more" aria-hidden="true"><span></span><span></span><span></span><div class="notify-badge">4</div></div>
          </div>

          <h1 class="hero-title">请寄回商品</h1>
          <div class="hero-desc">商家已同意退货，请您在 <span class="deadline" id="countdownText">6天23小时59分</span> 内寄回商品</div>
        </div>

        <section class="card merchant-card">
          <div class="merchant-address">
            <div class="merchant-label">商家地址</div>
            <div class="merchant-value">
              <div class="merchant-name-line"><span id="receiverText">郑子玄-新退货</span><span id="phoneText">18357909912</span></div>
              <span class="merchant-address-line" id="addressText">浙江省金华市义乌市苏溪镇上楼3区19幢一楼</span>
              <span class="copy-action" id="copyBtn"><span class="copy-icon"></span>复制</span>
            </div>
          </div>

          <div class="separator"></div>

          <div class="send-row">
            <div>
              <div class="send-title">上门取件|驿站|快递柜</div>
              <div class="free-tag">退换免运费(最高30元)</div>
              <div class="send-desc">2小时上门·免填地址·极速退款</div>
            </div>
            <button class="primary-btn">我要寄件</button>
          </div>

          <div class="self-send-row">
            <div>
              <div class="self-title">我已自行寄回商品</div>
              <div class="self-desc">运费需您自付/垫付</div>
            </div>
            <button class="outline-btn">填写单号</button>
          </div>
        </section>

        <section class="card service-card">
          <div class="service-title">服务保障</div>
          <div class="service-line">
            <div><span class="shield"></span><span class="service-strong">退换免运费</span> 运费商家承担，线下寄件赔首重</div>
            <div class="view-link">查看 <span class="chevron-right"></span></div>
          </div>
        </section>

        <section class="card record-card">
          <div class="record-title">协商记录</div>
          <span class="chevron-right"></span>
        </section>

        <section class="card return-card">
          <div class="return-head">
            <div class="return-title">退货信息</div>
            <div class="contact"><span class="chat-icon"><span></span></span>联系商家</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/address-parse@1.2.19/dist/bundle.js"></script>
  <script>
    const SHOT_WIDTH = 1179;
    const SHOT_HEIGHT = 2556;

    const receiverInput = document.getElementById('receiverInput');
    const phoneInput = document.getElementById('phoneInput');
    const addressInput = document.getElementById('addressInput');
    const fullAddressInput = document.getElementById('fullAddressInput');

    const receiverText = document.getElementById('receiverText');
    const phoneText = document.getElementById('phoneText');
    const addressText = document.getElementById('addressText');
    const countdownText = document.getElementById('countdownText');
    const captureRoot = document.getElementById('captureRoot');
    const scaleViewport = document.getElementById('scaleViewport');

    function updateStageScale() {
      const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
      const scale = Math.min(1, vw / SHOT_WIDTH);
      document.documentElement.style.setProperty('--stage-scale', scale.toString());
      scaleViewport.style.height = `${SHOT_HEIGHT * scale + 20}px`;
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function formatCountdown(totalMinutes) {
      const days = Math.floor(totalMinutes / 1440);
      const hours = Math.floor((totalMinutes % 1440) / 60);
      const minutes = totalMinutes % 60;
      return `${days}天${hours}小时${minutes}分`;
    }

    function randomizeStatusBar() {
      // 每次刷新页面都重新生成左上角时间和电量，避免截图看起来固定。
      const hour = randomInt(9, 12);
      const minute = randomInt(0, 59);
      document.getElementById('statusTime').textContent = `${hour}:${String(minute).padStart(2, '0')}`;
      document.getElementById('statusBattery').textContent = randomInt(68, 99);

      // 寄回商品倒计时控制在 7 天内，接近真实页面刚同意退货后的状态。
      const minMinutes = 6 * 1440 + 18 * 60;
      const maxMinutes = 7 * 1440 - 1;
      countdownText.textContent = formatCountdown(randomInt(minMinutes, maxMinutes));
    }

    function applyAddress() {
      receiverText.textContent = receiverInput.value.trim() || '郑子玄-新退货';
      phoneText.textContent = phoneInput.value.trim() || '18357909912';
      addressText.textContent = addressInput.value.trim() || '浙江省金华市义乌市苏溪镇上楼3区19幢一楼';
      requestAnimationFrame(updateStageScale);
    }

    function normalizePastedText(raw) {
      return raw
        .replace(/\r/g, '\n')
        .replace(/[　\t]+/g, ' ')
        .replace(/[，,]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function cleanParsedName(name) {
      let value = (name || '').replace(/\s+/g, '').trim();
      const labelPattern = /^(?:商家|卖家|退货|寄回|寄件|收货|收件|地址|联系)?信息[:：]?|(?:商家|卖家|退货|寄回|寄件|收货|收件|地址|联系)?信息[:：]?$/g;
      const edgeLabelPattern = /^(?:联系人|收件人|收货人|姓名|名字|商家名称|商家名)[:：]?|(?:联系人|收件人|收货人|姓名|名字|商家名称|商家名|手机号码|手机号|联系电话|电话|手机|所在地区|地区|省市区|详细地址|地址详情|地址信息)[:：]?$/g;

      // 地址平台常把“退货信息/地址信息”这类标签贴到姓名旁边，这里只清理姓名边缘。
      for (let i = 0; i < 4; i++) {
        const next = value
          .replace(edgeLabelPattern, '')
          .replace(labelPattern, '')
          .replace(/^[：:，,\s]+|[：:，,\s]+$/g, '')
          .trim();
        if (next === value) break;
        value = next;
      }
      return value;
    }

    function normalizeMunicipalityAddress(address) {
      return (address || '').replace(/^(北京|上海|天津|重庆)市?\1市/, '$1市');
    }

    function cleanParsedAddress(address) {
      const value = (address || '')
        .replace(/\s+/g, '')
        .replace(/^(?:所在地区|地区|省市区|商家地址|退货地址|寄回地址|收件地址|收货地址|地址|详细地址|地址详情|地址信息)[:：]?/, '');
      return normalizeMunicipalityAddress(value);
    }

    function findAddressStart(text) {
      return text.search(/(?:北京市|天津市|上海市|重庆市|[^\s]{2,8}(?:省|自治区|特别行政区)|[^\s]{2,8}市|[^\s]{2,8}县)/);
    }

    function parseAddressFirstText(text) {
      const phone = text.match(/1[3-9]\d{9}/)?.[0] || '';
      if (!phone) return null;

      const beforePhone = normalizePastedText(text.replace(phone, ' '));
      if (findAddressStart(beforePhone) !== 0) return null;

      const parts = beforePhone.split(' ').filter(Boolean);
      if (parts.length < 2) return null;

      const nameCandidate = cleanParsedName(parts[parts.length - 1]);
      const addressCandidate = cleanParsedAddress(parts.slice(0, -1).join(''));

      // 处理“地址 姓名 手机号”格式：最后一个短词才当姓名，避免把整段地址误当成姓名。
      if (!nameCandidate || nameCandidate.length > 6 || !addressCandidate) return null;

      return {
        name: nameCandidate,
        mobile: phone,
        address: addressCandidate
      };
    }

    function extractLabeledValue(source, labels) {
      const allLabels = '收件人|收货人|联系人|姓名|名字|商家名称|商家名|手机号码|手机号|联系电话|电话|手机|所在地区|地区|省市区|详细地址|地址详情|地址信息|商家地址|退货地址|寄回地址|收件地址|收货地址|地址';
      const labelGroup = labels.join('|');
      const re = new RegExp(`(?:^|[\\n\\s])(?:${labelGroup})\\s*[:：]\\s*([\\s\\S]*?)(?=(?:[\\n\\s]+(?:${allLabels})\\s*[:：])|$)`);
      const match = source.match(re);
      return match ? match[1].replace(/\s+/g, ' ').trim() : '';
    }

    function parseLabeledCombinedText(raw) {
      const source = raw.replace(/\r/g, '\n').replace(/[　\t]+/g, ' ').trim();
      const name = cleanParsedName(extractLabeledValue(source, ['收件人', '收货人', '联系人', '姓名', '名字', '商家名称', '商家名']));
      const labeledPhone = extractLabeledValue(source, ['手机号码', '手机号', '联系电话', '电话', '手机']).match(/1[3-9]\d{9}/)?.[0] || '';
      const phone = labeledPhone || source.match(/1[3-9]\d{9}/)?.[0] || '';
      const region = cleanParsedAddress(extractLabeledValue(source, ['所在地区', '地区', '省市区']));
      const detail = cleanParsedAddress(extractLabeledValue(source, ['详细地址', '地址详情', '地址信息', '商家地址', '退货地址', '寄回地址', '收件地址', '收货地址', '地址']));
      const address = cleanParsedAddress(`${region}${detail}`);

      if (!name && !labeledPhone && !region && !detail) return null;
      return { name, mobile: phone, address };
    }

    function fallbackParseCombinedText(text) {
      const phone = text.match(/1[3-9]\d{9}/)?.[0] || '';
      const withoutPhone = phone ? text.replace(phone, ' ') : text;
      const normalized = normalizePastedText(withoutPhone);
      const addressStart = findAddressStart(normalized);
      if (addressStart > 0) {
        return {
          name: cleanParsedName(normalized.slice(0, addressStart)),
          mobile: phone,
          address: cleanParsedAddress(normalized.slice(addressStart))
        };
      }
      const parts = normalized.split(' ').filter(Boolean);
      return {
        name: cleanParsedName(parts[0] || ''),
        mobile: phone,
        address: cleanParsedAddress(parts.slice(1).join(''))
      };
    }

    function buildParsedFromLibraryResult(result) {
      if (!result) return null;
      let address = '';
      if (result.city && result.province && result.city.startsWith(result.province)) {
        address = result.city;
      } else {
        address = (result.province || '') + (result.city || '');
      }
      address += (result.area || '') + (result.details || '');
      return {
        name: cleanParsedName(result.name || ''),
        mobile: result.mobile || '',
        address: cleanParsedAddress(address)
      };
    }

    function parseCombinedText(raw) {
      const text = normalizePastedText(raw);
      if (!text) return;

      // 有明确字段标签时先按标签拆分，避免“手机号码/所在地区/详细地址”混进姓名或地址。
      let parsed = parseLabeledCombinedText(raw);
      if (!parsed) parsed = parseAddressFirstText(text);
      if (!parsed) {
        try {
          if (window.AddressParse) {
            const result = AddressParse.ParseAddress(text)[0];
            parsed = buildParsedFromLibraryResult(result);
          }
        } catch (e) {
          parsed = null;
        }
      }

      // 外部 address-parse（地址解析库）失败或结果不完整时，用手机号和空格做兜底拆分。
      if (!parsed || !parsed.name || !parsed.mobile || !parsed.address) {
        const fallback = fallbackParseCombinedText(text);
        parsed = {
          name: parsed?.name || fallback.name,
          mobile: parsed?.mobile || fallback.mobile,
          address: parsed?.address || fallback.address
        };
      }

      if (parsed.name) receiverInput.value = parsed.name;
      if (parsed.mobile) phoneInput.value = parsed.mobile;
      if (parsed.address) addressInput.value = parsed.address;
      applyAddress();
    }

    function applyQueryPreset() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('shot') === '1') document.body.classList.add('shot-mode');

      const combinedText = params.get('text');
      if (combinedText) {
        fullAddressInput.value = combinedText;
        parseCombinedText(combinedText);
        return;
      }

      const name = params.get('name');
      const phone = params.get('phone');
      const address = params.get('address');
      if (name) receiverInput.value = cleanParsedName(name);
      if (phone) phoneInput.value = phone.trim();
      if (address) addressInput.value = cleanParsedAddress(address);
      if (name || phone || address) applyAddress();
    }

    async function renderCanvas() {
      applyAddress();
      const clone = captureRoot.cloneNode(true);
      clone.id = 'captureClone';
      clone.classList.add('exporting');
      const wrapper = document.createElement('div');
      wrapper.className = 'export-clone';
      wrapper.appendChild(clone);
      document.body.appendChild(wrapper);
      try {
        const canvas = await html2canvas(clone, {
          useCORS: true,
          backgroundColor: '#f4f5f7',
          scale: 1,
          width: SHOT_WIDTH,
          height: SHOT_HEIGHT,
          windowWidth: SHOT_WIDTH,
          windowHeight: SHOT_HEIGHT,
          scrollX: 0,
          scrollY: 0
        });
        return await new Promise(res => canvas.toBlob(res, 'image/png'));
      } finally {
        wrapper.remove();
      }
    }

    async function exportScreenshot() {
      try {
        const blob = await renderCanvas();
        const file = new File([blob], '寄回商品详情.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
        } else {
          const link = document.createElement('a');
          link.download = '寄回商品详情截图.png';
          link.href = URL.createObjectURL(blob);
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 5000);
        }
      } catch (e) {
        if (e.name !== 'AbortError') alert('导出失败');
      }
    }

    document.getElementById('parseBtn').addEventListener('click', async () => {
      try {
        const clip = await navigator.clipboard.readText();
        if (clip && clip.trim()) {
          fullAddressInput.value = clip.trim();
          parseCombinedText(clip);
        }
      } catch (e) {
        if (fullAddressInput.value.trim()) parseCombinedText(fullAddressInput.value);
      }
    });

    document.getElementById('applyBtn').addEventListener('click', applyAddress);

    fullAddressInput.addEventListener('input', () => {
      const value = fullAddressInput.value.trim();
      if (value) parseCombinedText(value);
    });

    receiverInput.addEventListener('input', applyAddress);
    phoneInput.addEventListener('input', applyAddress);
    addressInput.addEventListener('input', applyAddress);

    document.getElementById('fillSampleBtn').addEventListener('click', () => {
      receiverInput.value = '郑子玄-新退货';
      phoneInput.value = '18357909912';
      addressInput.value = '浙江省金华市义乌市苏溪镇上楼3区19幢一楼';
      fullAddressInput.value = '';
      applyAddress();
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const text = `${receiverText.textContent} ${phoneText.textContent}\n${addressText.textContent}`;
      try {
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById('copyBtn');
        const old = btn.innerHTML;
        btn.textContent = '已复制';
        setTimeout(() => { btn.innerHTML = old; }, 1200);
      } catch (e) {
        alert('复制失败，请手动复制');
      }
    });

    document.getElementById('exportBtn').addEventListener('click', exportScreenshot);

    window.addEventListener('resize', updateStageScale);
    window.addEventListener('orientationchange', () => setTimeout(updateStageScale, 120));

    randomizeStatusBar();
    applyQueryPreset();
    applyAddress();
    updateStageScale();
  </script>
